<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Velora Bay — Open-World Crime Game</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #14161a; font-family: "Segoe UI", Arial, sans-serif; }
  #game { display: block; width: 100vw; height: 100vh; background: #20241f; cursor: crosshair; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; z-index: 5; }
  .hud-box {
    position: absolute; background: rgba(10, 12, 16, 0.72); border: 1px solid rgba(255,255,255,0.18);
    border-radius: 8px; padding: 6px 10px; font-size: 14px; line-height: 1.45;
    text-shadow: 0 1px 2px rgba(0,0,0,0.8);
  }
  #hud-stars { top: 12px; left: 12px; font-size: 26px; letter-spacing: 4px; color: #ffd54a; }
  #hud-vitals { top: 12px; left: 210px; min-width: 210px; }
  #hud-vitals .bar { display: inline-block; width: 90px; height: 9px; background: rgba(255,255,255,0.2); border-radius: 4px; overflow: hidden; vertical-align: middle; }
  #hud-vitals .bar span { display: block; height: 100%; }
  #hud-cash { top: 12px; right: 200px; font-size: 18px; font-weight: bold; color: #7dff8a; }
  #hud-clock { top: 56px; right: 200px; font-size: 14px; }
  #hud-district { top: 56px; left: 12px; font-size: 13px; color: #cfe8ff; max-width: 420px; }
  #hud-objective { top: 100px; left: 12px; font-size: 14px; color: #ffe9a8; max-width: 460px; }
  #hud-banner {
    display: none; position: absolute; top: 18%; left: 50%; transform: translateX(-50%);
    background: rgba(10, 12, 16, 0.82); border: 2px solid #ffd54a; border-radius: 10px;
    padding: 10px 22px; font-size: 22px; font-weight: bold; color: #ffd54a;
    text-align: center; max-width: 80vw; box-shadow: 0 4px 24px rgba(0,0,0,0.6);
  }
  #hud-speed { bottom: 16px; right: 200px; font-size: 26px; font-weight: bold; text-align: right; min-width: 150px; }
  #hud-speed small { font-size: 13px; color: #cfe8ff; }
  #hud-message { bottom: 16px; left: 50%; transform: translateX(-50%); font-size: 15px; color: #fff; display: none; max-width: 70vw; text-align: center; }
  #hud-hint { bottom: 60px; left: 12px; font-size: 14px; color: #9fd8ff; display: none; }
  #hud-weapon { bottom: 16px; left: 12px; font-size: 13px; color: #e8e8e8; }
  #hud-minimap-box { position: absolute; right: 12px; bottom: 12px; padding: 4px; }
  #minimap { display: block; border-radius: 6px; }
  #menu-overlay {
    position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, rgba(20,8,40,0.88), rgba(8,30,50,0.88));
  }
  .menu-card {
    max-width: 680px; width: 92vw; background: rgba(12,14,20,0.94); border: 2px solid #f2a541;
    border-radius: 16px; padding: 28px 32px; color: #fff; text-align: center;
    box-shadow: 0 12px 48px rgba(0,0,0,0.7);
  }
  .menu-card.small { max-width: 520px; }
  .menu-card h1 { font-size: 44px; letter-spacing: 6px; color: #f2a541; margin-bottom: 6px; }
  .menu-card h1.gold { color: #ffd54a; }
  .menu-card h2 { font-size: 22px; color: #4fd8ff; margin-bottom: 10px; }
  .menu-card .tagline { font-size: 17px; color: #cfe8ff; margin-bottom: 12px; }
  .menu-card .story { font-size: 15px; line-height: 1.6; color: #eee; margin-bottom: 12px; text-align: left; }
  .menu-card .chars { font-size: 13px; color: #ffd54a; margin-bottom: 16px; }
  .menu-card .controls { font-size: 13px; line-height: 1.7; color: #bcd; margin-top: 14px; }
  .menu-card .fine { font-size: 12px; color: #9aa; margin-top: 10px; }
  .menu-buttons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 8px 0; }
  .menu-buttons button, .shop-item {
    pointer-events: auto; cursor: pointer; background: #f2a541; color: #1a1206; border: none;
    border-radius: 8px; padding: 12px 20px; font-size: 16px; font-weight: bold;
  }
  .menu-buttons button:hover, .shop-item:hover { background: #ffd54a; }
  #shop-panel {
    display: none; position: fixed; right: 200px; top: 110px; z-index: 8; width: 340px;
    background: rgba(12,14,20,0.95); border: 2px solid #4caf50; border-radius: 12px;
    padding: 16px; color: #fff;
  }
  #shop-panel h2 { color: #7dff8a; margin-bottom: 6px; }
  #shop-panel .shop-item { display: block; width: 100%; margin: 6px 0; padding: 9px 12px; font-size: 14px; text-align: left; background: #2e7d32; color: #fff; }
  #shop-panel .shop-item:hover { background: #43a047; }
  #selftest {
    display: none; position: fixed; left: 12px; bottom: 110px; z-index: 20; width: 520px; max-height: 60vh;
    overflow: auto; background: rgba(0,0,0,0.85); color: #7dff8a; font-size: 12px; padding: 10px;
    border: 1px solid #4caf50; border-radius: 8px; white-space: pre-wrap;
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="800"></canvas>
<div id="hud"></div>
<div id="shop-panel"></div>
<div id="menu-overlay"></div>
<pre id="selftest"></pre>
<script type="module" src="./js/main.js"></script>
</body>
</html>
